[workspace]
resolver = "3"
members = ["must-hop", "libloragw-sys", "loragw", "must-gw", "must-dash"]
exclude = [
  "examples/ble/esp32c6",
  "examples/lora/rak3272s",
  "examples/gateway/sx1302",
]

[workspace.dependencies]

lora-phy = { path = "../../repos/pr-lora-rs/lora-phy" }
# lora-phy = "3.0.1"
lora-modulation = "0.1.5"

[profile.dev]
opt-level = "s"

[profile.release]
debug = true
