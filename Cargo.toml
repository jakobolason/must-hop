[workspace]
resolver = "3"
members = ["must-hop", "libloragw-sys", "loragw", "must-gw"]
exclude = [
  "examples/ble/esp32c6",
  "examples/lora/rak3272s",
  "examples/gateway/sx1302",
]

[workspace.dependencies]

lora-phy = { path = "../../repos/pr-lora-rs/lora-phy" }
lora-modulation = { path = "../../repos/pr-lora-rs/lora-modulation" }

[profile.dev]
opt-level = "s"

[profile.release]
debug = true
